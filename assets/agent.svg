<svg xmlns="http://www.w3.org/2000/svg" width="460" height="440" viewBox="0 0 460 440" role="img" aria-label="Animated diagram of an AI agent pipeline">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1330"/>
      <stop offset="1" stop-color="#140c33"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
      .box  { fill: #0b1024; stroke-width: 1.5; }
      .lbl  { font-size: 13px; fill: #e2e8f0; text-anchor: middle; font-weight: 600; }
      .sub  { font-size: 10.5px; fill: #8b95b0; text-anchor: middle; }
      .wire { fill: none; stroke: #334155; stroke-width: 1.5; stroke-dasharray: 4 4; animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -16 } }
      .hl { animation: hl 4.8s ease-in-out infinite; }
      .h2 { animation-delay: 1.2s } .h3 { animation-delay: 2.4s } .h4 { animation-delay: 3.6s }
      @keyframes hl { 0%,100% { stroke-opacity: .45 } 12% { stroke-opacity: 1 } 30% { stroke-opacity: .45 } }
      .ok { animation: ok 4.8s ease-in-out infinite; }
      @keyframes ok { 0%,70% { opacity: .25 } 80%,95% { opacity: 1 } 100% { opacity: .25 } }
    </style>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="458" height="438" rx="14" fill="url(#win)" stroke="#232b4d"/>
  <rect x="1" y="1" width="458" height="34" rx="14" fill="#0a0f24"/>
  <rect x="1" y="22" width="458" height="13" fill="#0a0f24"/>
  <circle cx="22" cy="18" r="5" fill="#ff5f57"/><circle cx="40" cy="18" r="5" fill="#febc2e"/><circle cx="58" cy="18" r="5" fill="#28c840"/>
  <text x="230" y="22" class="mono" font-size="12" fill="#8b95b0" text-anchor="middle">agent.run("what drove costs up in Q3?")</text>

  <!-- wires -->
  <path id="w1" class="wire" d="M230 92 V122"/>
  <path id="w2" class="wire" d="M230 166 C230 186 90 180 90 206"/>
  <path id="w3" class="wire" d="M230 166 V206"/>
  <path id="w4" class="wire" d="M230 166 C230 186 370 180 370 206"/>
  <path id="w5" class="wire" d="M90 250 C90 276 230 270 230 292"/>
  <path id="w6" class="wire" d="M230 250 V292"/>
  <path id="w7" class="wire" d="M370 250 C370 276 230 270 230 292"/>
  <path id="w8" class="wire" d="M230 336 V366"/>

  <!-- pulses -->
  <g filter="url(#glow)">
    <circle r="4.5" fill="#22d3ee"><animateMotion dur="4.8s" keyPoints="0;1;1" keyTimes="0;0.15;1" calcMode="linear" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle>
    <circle r="4.5" fill="#67e8f9"><animateMotion dur="4.8s" keyPoints="0;0;1;1" keyTimes="0;0.2;0.4;1" calcMode="linear" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle>
    <circle r="4.5" fill="#818cf8"><animateMotion dur="4.8s" keyPoints="0;0;1;1" keyTimes="0;0.2;0.4;1" calcMode="linear" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle>
    <circle r="4.5" fill="#a78bfa"><animateMotion dur="4.8s" keyPoints="0;0;1;1" keyTimes="0;0.2;0.4;1" calcMode="linear" repeatCount="indefinite"><mpath href="#w4"/></animateMotion></circle>
    <circle r="4.5" fill="#67e8f9"><animateMotion dur="4.8s" keyPoints="0;0;1;1" keyTimes="0;0.45;0.62;1" calcMode="linear" repeatCount="indefinite"><mpath href="#w5"/></animateMotion></circle>
    <circle r="4.5" fill="#818cf8"><animateMotion dur="4.8s" keyPoints="0;0;1;1" keyTimes="0;0.45;0.62;1" calcMode="linear" repeatCount="indefinite"><mpath href="#w6"/></animateMotion></circle>
    <circle r="4.5" fill="#a78bfa"><animateMotion dur="4.8s" keyPoints="0;0;1;1" keyTimes="0;0.45;0.62;1" calcMode="linear" repeatCount="indefinite"><mpath href="#w7"/></animateMotion></circle>
    <circle r="4.5" fill="#c084fc"><animateMotion dur="4.8s" keyPoints="0;0;1;1" keyTimes="0;0.66;0.78;1" calcMode="linear" repeatCount="indefinite"><mpath href="#w8"/></animateMotion></circle>
  </g>

  <!-- query -->
  <rect x="140" y="52" width="180" height="40" rx="10" class="box hl" stroke="#22d3ee"/>
  <text x="230" y="70" class="mono lbl">user query</text>
  <text x="230" y="84" class="mono sub">natural language</text>

  <!-- agent -->
  <rect x="120" y="122" width="220" height="44" rx="10" class="box hl h2" stroke="url(#acc)"/>
  <text x="230" y="141" class="mono lbl">agent · LangGraph</text>
  <text x="230" y="157" class="mono sub">plan → choose tools → act</text>

  <!-- tools -->
  <rect x="24" y="206" width="132" height="44" rx="10" class="box hl h3" stroke="#22d3ee"/>
  <text x="90" y="225" class="mono lbl">retriever</text>
  <text x="90" y="241" class="mono sub">Qdrant · hybrid RAG</text>

  <rect x="164" y="206" width="132" height="44" rx="10" class="box hl h3" stroke="#818cf8"/>
  <text x="230" y="225" class="mono lbl">text-to-SQL</text>
  <text x="230" y="241" class="mono sub">Postgres · Vanna</text>

  <rect x="304" y="206" width="132" height="44" rx="10" class="box hl h3" stroke="#a78bfa"/>
  <text x="370" y="225" class="mono lbl">tools</text>
  <text x="370" y="241" class="mono sub" style="font-size:9.5px">Gmail · Sheets · Slack</text>

  <!-- llm -->
  <rect x="120" y="292" width="220" height="44" rx="10" class="box hl h4" stroke="#c084fc"/>
  <text x="230" y="311" class="mono lbl">LLM synthesis</text>
  <text x="230" y="327" class="mono sub">Claude · GPT · Gemini · Llama</text>

  <!-- answer -->
  <g class="ok">
    <rect x="110" y="366" width="240" height="44" rx="22" fill="#052e2b" stroke="#34d399" stroke-width="1.5"/>
    <text x="230" y="393" class="mono" font-size="13" font-weight="600" fill="#6ee7b7" text-anchor="middle">✓ grounded answer + sources</text>
  </g>
</svg>
