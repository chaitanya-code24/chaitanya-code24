<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Chaitanya Lokhande, AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060914"/>
      <stop offset="0.55" stop-color="#0c1230"/>
      <stop offset="1" stop-color="#1b0f3d"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
      .sans { font-family: 'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif; }
      .edge { stroke: #7c8cff; stroke-opacity: 0.16; stroke-width: 1.2; }
      .node { fill: #0c1230; stroke-width: 2; }
      .n-in  { stroke: #22d3ee; }
      .n-hid { stroke: #818cf8; }
      .n-out { stroke: #c084fc; }
      .core { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .d1 { animation-delay: .3s } .d2 { animation-delay: .6s } .d3 { animation-delay: .9s }
      .d4 { animation-delay: 1.2s } .d5 { animation-delay: 1.5s } .d6 { animation-delay: 1.8s }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.8) } 50% { opacity: 1; transform: scale(1.15) } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .fade { opacity: 0; animation: fadein .9s ease-out forwards; }
      .f1 { animation-delay: .1s } .f2 { animation-delay: .45s } .f3 { animation-delay: .8s } .f4 { animation-delay: 1.15s }
      @keyframes fadein { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      .float { animation: drift 7s ease-in-out infinite; }
      @keyframes drift { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)"/>
  <circle cx="180" cy="80" r="260" fill="url(#glowL)"/>
  <circle cx="1030" cy="200" r="300" fill="url(#glowR)"/>

  <!-- particles -->
  <g fill="#c7d2fe" class="float">
    <circle cx="620" cy="60" r="1.4" opacity=".5"/><circle cx="700" cy="300" r="1.2" opacity=".4"/>
    <circle cx="560" cy="250" r="1" opacity=".35"/><circle cx="760" cy="120" r="1.6" opacity=".45"/>
    <circle cx="90" cy="300" r="1.2" opacity=".35"/><circle cx="1240" cy="60" r="1.3" opacity=".4"/>
    <circle cx="470" cy="40" r="1" opacity=".3"/><circle cx="1200" cy="320" r="1.2" opacity=".35"/>
  </g>

  <!-- ===== left: identity ===== -->
  <g class="fade f1">
    <text x="72" y="104" class="mono" font-size="18" fill="#22d3ee">&gt;_ hello world, I'm</text>
  </g>
  <g class="fade f2">
    <text x="70" y="172" class="sans" font-size="66" font-weight="800" fill="url(#name)" letter-spacing="-1">Chaitanya Lokhande</text>
  </g>
  <g class="fade f3">
    <rect x="72" y="196" width="88" height="4" rx="2" fill="url(#accent)"/>
    <text x="72" y="238" class="sans" font-size="25" font-weight="600" fill="#e0e7ff">AI Engineer
      <tspan fill="#6b7280"> · </tspan><tspan fill="#67e8f9">LLM Agents</tspan>
      <tspan fill="#6b7280"> · </tspan><tspan fill="#a5b4fc">RAG</tspan>
      <tspan fill="#6b7280"> · </tspan><tspan fill="#d8b4fe">Computer Vision</tspan></text>
  </g>
  <g class="fade f4">
    <text x="72" y="286" class="mono" font-size="16" fill="#94a3b8">shipping AI that works outside the notebook<tspan class="cursor" fill="#22d3ee"> ▍</tspan></text>
  </g>

  <!-- ===== right: neural network ===== -->
  <g transform="translate(0,0)">
    <!-- edges layer1 -> layer2 -->
    <g class="edge">
      <path id="e1" d="M880 90 L1020 70"/><path d="M880 90 L1020 140"/><path d="M880 90 L1020 210"/>
      <path id="e2" d="M880 160 L1020 140"/><path d="M880 160 L1020 70"/><path d="M880 160 L1020 280"/>
      <path id="e3" d="M880 230 L1020 210"/><path d="M880 230 L1020 140"/><path d="M880 230 L1020 280"/>
      <path id="e4" d="M880 300 L1020 280"/><path d="M880 300 L1020 210"/>
      <!-- layer2 -> layer3 -->
      <path id="e5" d="M1020 70 L1160 120"/><path d="M1020 70 L1160 240"/>
      <path id="e6" d="M1020 140 L1160 120"/><path d="M1020 140 L1160 240"/>
      <path id="e7" d="M1020 210 L1160 240"/><path d="M1020 210 L1160 120"/>
      <path id="e8" d="M1020 280 L1160 240"/>
    </g>

    <!-- signal pulses -->
    <g filter="url(#blur)" opacity=".9">
      <circle r="5" fill="#22d3ee"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
      <circle r="5" fill="#22d3ee"><animateMotion dur="2.6s" begin=".5s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
      <circle r="5" fill="#22d3ee"><animateMotion dur="2.4s" begin="1s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
      <circle r="5" fill="#22d3ee"><animateMotion dur="2.8s" begin="1.4s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>
      <circle r="5" fill="#c084fc"><animateMotion dur="2.2s" begin=".9s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion></circle>
      <circle r="5" fill="#c084fc"><animateMotion dur="2.5s" begin="1.6s" repeatCount="indefinite"><mpath href="#e6"/></animateMotion></circle>
      <circle r="5" fill="#c084fc"><animateMotion dur="2.3s" begin=".2s" repeatCount="indefinite"><mpath href="#e7"/></animateMotion></circle>
      <circle r="5" fill="#c084fc"><animateMotion dur="2.7s" begin="1.1s" repeatCount="indefinite"><mpath href="#e8"/></animateMotion></circle>
    </g>
    <g>
      <circle r="2.4" fill="#ecfeff"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
      <circle r="2.4" fill="#ecfeff"><animateMotion dur="2.6s" begin=".5s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
      <circle r="2.4" fill="#ecfeff"><animateMotion dur="2.4s" begin="1s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
      <circle r="2.4" fill="#ecfeff"><animateMotion dur="2.8s" begin="1.4s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>
      <circle r="2.4" fill="#faf5ff"><animateMotion dur="2.2s" begin=".9s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion></circle>
      <circle r="2.4" fill="#faf5ff"><animateMotion dur="2.5s" begin="1.6s" repeatCount="indefinite"><mpath href="#e6"/></animateMotion></circle>
      <circle r="2.4" fill="#faf5ff"><animateMotion dur="2.3s" begin=".2s" repeatCount="indefinite"><mpath href="#e7"/></animateMotion></circle>
      <circle r="2.4" fill="#faf5ff"><animateMotion dur="2.7s" begin="1.1s" repeatCount="indefinite"><mpath href="#e8"/></animateMotion></circle>
    </g>

    <!-- nodes -->
    <g>
      <circle class="node n-in" cx="880" cy="90" r="13"/><circle class="core d1" cx="880" cy="90" r="5" fill="#22d3ee"/>
      <circle class="node n-in" cx="880" cy="160" r="13"/><circle class="core d3" cx="880" cy="160" r="5" fill="#22d3ee"/>
      <circle class="node n-in" cx="880" cy="230" r="13"/><circle class="core d5" cx="880" cy="230" r="5" fill="#22d3ee"/>
      <circle class="node n-in" cx="880" cy="300" r="13"/><circle class="core d2" cx="880" cy="300" r="5" fill="#22d3ee"/>

      <circle class="node n-hid" cx="1020" cy="70" r="15"/><circle class="core d4" cx="1020" cy="70" r="6" fill="#818cf8"/>
      <circle class="node n-hid" cx="1020" cy="140" r="15"/><circle class="core d6" cx="1020" cy="140" r="6" fill="#818cf8"/>
      <circle class="node n-hid" cx="1020" cy="210" r="15"/><circle class="core d1" cx="1020" cy="210" r="6" fill="#818cf8"/>
      <circle class="node n-hid" cx="1020" cy="280" r="15"/><circle class="core d3" cx="1020" cy="280" r="6" fill="#818cf8"/>

      <circle class="node n-out" cx="1160" cy="120" r="18"/><circle class="core d2" cx="1160" cy="120" r="7" fill="#c084fc"/>
      <circle class="node n-out" cx="1160" cy="240" r="18"/><circle class="core d5" cx="1160" cy="240" r="7" fill="#c084fc"/>
    </g>

    <!-- layer labels -->
    <g class="mono" font-size="12" fill="#64748b" text-anchor="middle">
      <text x="880" y="340">input</text>
      <text x="1020" y="340">reason</text>
      <text x="1160" y="340">act</text>
    </g>
  </g>
</svg>
